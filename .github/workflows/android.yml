name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          npm install
          cd client && npm install

      - name: Build Android Debug APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk DailyNote.apk

      - name: Upload DailyNote APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyNote-Android-APK
          path: DailyNote.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: DailyNote Android APK v1.0.${{ github.run_number }}
          body: |
            ## 📱 DailyNote Android App
            Aplikasi DailyNote untuk smartphone Android.
            
            ### Cara Install:
            1. Download file `DailyNote.apk` di bawah.
            2. Buka file `.apk` tersebut di HP Android Anda.
            3. Jika muncul peringatan keamanan, pilih **"Tetap Install" (Install anyway)**.
          files: DailyNote.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

